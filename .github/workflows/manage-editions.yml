name: Manage Editions

on:
  issues:
    types: [labeled, edited]

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: >
      (github.event.action == 'labeled' && github.event.label.name == 'approved') ||
      (github.event.action == 'edited' && contains(github.event.issue.labels.*.name, 'approved'))
    steps:
      - uses: actions/checkout@v4

      - name: Check actor is a maintainer
        env:
          ACTOR: ${{ github.actor }}
        run: |
          if ! grep -qx "$ACTOR" MAINTAINERS; then
            echo "::error::$ACTOR is not listed in MAINTAINERS"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Sync editions.yml from issue body
        id: sync
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          RESULT=$(python scripts/update_editions.py --body "$ISSUE_BODY" 2>&1) || {
            echo "result<<EOF" >> "$GITHUB_OUTPUT"
            echo "$RESULT" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          echo "result<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RESULT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Comment on error
        if: steps.sync.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          RESULT: ${{ steps.sync.outputs.result }}
        run: gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "$RESULT"

      - name: Commit if changed
        id: commit
        if: steps.sync.outputs.failed != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editions.yml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Sync editions.yml from issue #${{ github.event.issue.number }}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on success
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          RESULT: ${{ steps.sync.outputs.result }}
        run: |
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "$RESULT"
          gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --remove-label "needs-review" || true

      - name: Close on publish
        if: "steps.commit.outputs.changed == 'true' && contains(steps.sync.outputs.result, 'Status: published')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE" -R "$GITHUB_REPOSITORY"
